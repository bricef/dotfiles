wtf:
  colors:
    border:
      focusable: darkslateblue
      focused: orange
      normal: gray
  grid:
    # Proportional sizing: 0 = equal weight, negative = relative weight,
    # positive = fixed cells/lines. The right column gets slightly more
    # width (weight 6 vs 5) so the Claude agents `cwd` column has room.
    columns: [-5, -6]
    rows: [0, 0]
  refreshInterval: 1
  term: xterm-256color
  mods:
    system:
      type: cmdrunner
      enabled: true
      cmd: bash
      args: ["-c", "$HOME/.config/wtf/scripts/sys.sh"]
      refreshInterval: 2
      title: " System "
      position:
        top: 0
        left: 0
        height: 1
        width: 1

    claude-agents:
      type: cmdrunner
      enabled: true
      cmd: bash
      args: ["-c", "$HOME/.config/wtf/scripts/claude-agents.sh"]
      refreshInterval: 3
      title: " Claude Agents "
      position:
        top: 0
        left: 1
        height: 1
        width: 1

    ports:
      type: cmdrunner
      enabled: true
      cmd: bash
      args: ["-c", "$HOME/.config/wtf/scripts/ports.sh"]
      refreshInterval: 10
      title: " Listening Ports "
      position:
        top: 1
        left: 0
        height: 1
        width: 1

    docker:
      type: cmdrunner
      enabled: true
      cmd: bash
      args: ["-c", "$HOME/.config/wtf/scripts/docker.sh"]
      refreshInterval: 5
      title: " Docker "
      position:
        top: 1
        left: 1
        height: 1
        width: 1
