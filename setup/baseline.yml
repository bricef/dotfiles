---
# setup/baseline.yml — Brice's dev-machine baseline, as an idempotent play.
#
#   setup/bootstrap.sh                 first time (installs ansible, clones, runs this)
#   ansible-playbook setup/baseline.yml [-K]   any time after
#
# What "baseline" means: zsh (with oh-my-zsh) as the login shell, starship,
# every tool bin/env-audit checks for, gh, claude, and this repository
# stowed into $HOME. Each tool is installed the way it is on the reference
# machine — apt where the distribution is current enough, the vendor's
# apt repository for gh and helix, rustup + cargo-binstall for the Rust
# tools (prebuilt binaries, seconds not minutes), the official tarball for
# Go, `go install` for asdf and wtf, the upstream installers for starship,
# mise, uv and claude. Versions that are pinned are pinned at the top.
#
# Debian/Ubuntu only for now; the play refuses anything else rather than
# half-applying. System steps use become; everything else runs as you.
#
# Run it twice and the second run changes nothing — that is the test.
- name: Bring this machine up to Brice's baseline
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    home: "{{ ansible_env.HOME }}"
    me: "{{ ansible_user_id }}"
    dotfiles_dir: "{{ home }}/Code/github.com/bricef/dotfiles"
    dotfiles_ssh_remote: git@github.com:bricef/dotfiles.git
    go_version: "1.26.3"
    asdf_version: "v0.19.0"
    wtf_version: "v0.49.1"
    apt_packages:
      - zsh
      - git
      - curl
      - jq
      - stow
      - unzip
      - ca-certificates
      - gnupg
      - build-essential
      - pkg-config
      - libssl-dev
    # crate → the binary it puts in ~/.cargo/bin (what makes the step idempotent)
    cargo_tools:
      eza: eza
      zellij: zellij
      bat: bat
      git-delta: delta
      yazi-fm: yazi
      yazi-cli: ya
      du-dust: dust
      ripgrep: rg
      zoxide: zoxide
      television: tv
      uv: uv

  environment:
    PATH: "{{ home }}/.cargo/bin:{{ home }}/.local/bin:{{ home }}/go/bin:/usr/local/go/bin:/usr/local/bin:{{ ansible_env.PATH }}"

  pre_tasks:
    - name: This play knows Debian and Ubuntu
      ansible.builtin.assert:
        that: ansible_os_family == "Debian"
        fail_msg: "baseline.yml is written for Debian/Ubuntu (apt); {{ ansible_distribution }} needs its own package steps"

  tasks:
    # ------------------------------------------------------------ system ---
    - name: Distribution packages
      become: true
      ansible.builtin.apt:
        name: "{{ apt_packages }}"
        state: present
        update_cache: true
        cache_valid_time: 3600
      environment:
        DEBIAN_FRONTEND: noninteractive
        NEEDRESTART_MODE: a

    - name: GitHub CLI apt keyring
      become: true
      ansible.builtin.get_url:
        url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
        dest: /etc/apt/keyrings/githubcli-archive-keyring.gpg
        mode: "0644"

    - name: GitHub CLI apt source
      become: true
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/github-cli.list
        mode: "0644"
        content: "deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }} signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main\n"
      register: gh_source

    # The helix PPA, as the deb822 source add-apt-repository would write,
    # with the PPA's signing key inline — no keyserver round trip, no
    # software-properties-common. Ubuntu only: a PPA is built per Ubuntu
    # release, so Debian gets helix from its own archive instead.
    - name: Helix editor PPA (Ubuntu)
      become: true
      when: ansible_distribution == "Ubuntu"
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/maveonair-ubuntu-helix-editor.sources
        mode: "0644"
        content: |
          Types: deb
          URIs: https://ppa.launchpadcontent.net/maveonair/helix-editor/ubuntu/
          Suites: {{ ansible_distribution_release }}
          Components: main
          Signed-By:
           -----BEGIN PGP PUBLIC KEY BLOCK-----
           .
           mQINBGO12s8BEACXL6xcHDOpwPgztfaK7ewwCqCf/mUrl0H/qAK5//YozVQPuvpM
           sdQRuvVfjPvp5rqxasQ+/BIyljjC1S4ZlfM6HzWJI4hBd19lO106PUrNX6Wt8Pm1
           2M/XGpIvtzjiy7zutgeB2h2jnjgNTs8z2bA/zUBZ8G7y106HAegCt8dbS27xJNJz
           lR8BVEUNSmZtuCNwC0LDTuLV12zFRrvXrf4rxLIu4cdtpYsnFRLQLRlAq/VNK3RI
           C62dDkDC9DRRgtYSeGTl7UBlg2AtuUIYxWO9US8XZHaz7qzUckLuViF7R1bGsInG
           2ldb3LCw4lho8vpEujY/1ZjAB5L1poGQK4yv1YkHMoyzs4asAiEIT94EDRcv2wka
           scmjXIjqiHcu6VnYrTw0ZPmOTHjeKW+yYi2Mzk032BKCm5gIyejSSEQ08OYvd7or
           FG3GTN2LcWTMSF1afSKw4UeYuHvAIPmOgU0+QkZmf+2g0fzcBdE7nbGK2PELL01f
           ugutJpxMn7a0jyPO5goibhh4PQsHAATgYgRL5n3MAtiULN5fnNqtonSSUHrRqBjd
           CWat4atyxxNtd+TVgOCTaXVmWl3O9kVmsBxu6dwTwKVtjdgBknWmass5DaBjoO4C
           BNVbAOj8I1wYBRz8LHUbM3d2Pooj20rm9SF4MU0Uar25EfD2EglpNIdrZQARAQAB
           tCBMYXVuY2hwYWQgUFBBIGZvciBGYWJpYW4gTWV0dGxlcokCTgQTAQoAOBYhBCdk
           K5/X8aFh/CUk4zVaT6UV18hVBQJjtdrPAhsDBQsJCAcCBhUKCQgLAgQWAgMBAh4B
           AheAAAoJEDVaT6UV18hVwwYP/3yFJeNpve2qqYi3NhdSS8Fr5i8yujMCoKJRZzBT
           RkeS/Zl2uSkM8nOFuWD9eCsNYcPqkmWm6x3uGl/v/gHC3fZ8O3MOdXskMa/4mTtJ
